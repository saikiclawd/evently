# ═══════════════════════════════════════════
# FloraFlow — Nginx Reverse Proxy
# Single upstream: gunicorn (Flask serves React + API)
# ═══════════════════════════════════════════

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=ai:10m    rate=10r/s;

# Single upstream — gunicorn on localhost:5001
upstream floraflow {
    server 127.0.0.1:5001;
    keepalive 32;
}

# ── Redirect HTTP → HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name evently.yourdomain.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS Server ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evently.yourdomain.com;

    # ── SSL ──
    ssl_certificate     /etc/letsencrypt/live/evently.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evently.yourdomain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-XSS-Protection          "1; mode=block"    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:;" always;

    # ── Gzip ──
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Upload size — 20 MB for AI image analysis ──
    client_max_body_size 20M;

    # ── Common proxy headers (reused below) ──
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version                 1.1;
    proxy_set_header Connection        "";

    # ── Auth routes — strict rate limit ──
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass         http://floraflow;
        proxy_read_timeout 30s;
    }

    # ── AI image analysis — separate zone (slow, large body) ──
    location /api/v1/flora/ai/ {
        limit_req zone=ai burst=5 nodelay;
        proxy_pass         http://floraflow;
        proxy_read_timeout 60s;   # Groq can take ~15–30 s
        proxy_connect_timeout 10s;
    }

    # ── All other API routes ──
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass         http://floraflow;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Static assets — long cache (Vite hashes filenames) ──
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|ico)$ {
        proxy_pass         http://floraflow;
        expires            30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Everything else → React SPA (served by Flask/gunicorn) ──
    location / {
        proxy_pass         http://floraflow;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── Block dotfiles and common attack paths ──
    location ~ /\. {
        deny all;
    }

    location ~* /(wp-admin|wp-login|xmlrpc|phpmyadmin) {
        return 444;
    }
}
